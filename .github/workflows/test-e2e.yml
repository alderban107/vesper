# E2E CI — Playwright browser tests
#
# Runs p0-smoke, p1-extended, and p2-reliability as enforced gates.
# The test harness boots its own PostgreSQL (Docker), Phoenix server, and Vite
# dev server automatically via globalSetup.

name: E2E Tests

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: test-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")

          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # E2E tests exercise the full stack; also trigger on workflow changes
          if git diff --name-only "$BASE" "${{ github.sha }}" -- 'server/' 'client/' 'sdk/' 'scripts/' '.github/workflows/test-e2e.yml' | grep -qvE '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-test:
    needs: e2e-changes
    if: needs.e2e-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "55432"
      TEST_DB_USER: vesper_sdk
      TEST_DB_PASS: vesper_sdk
      VESPER_SDK_TEST_DB_IMAGE: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Cache Elixir deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            server/deps
            server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('server/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install Elixir dependencies
        working-directory: server
        run: mix deps.get

      - name: Compile server
        working-directory: server
        run: mix compile

      - name: Install Node dependencies
        working-directory: client
        run: |
          npm ci --workspaces=false
          node ./scripts/link-sdk-node-modules.mjs

      - name: Configure Electron sandbox
        working-directory: client
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Build Electron boundary
        working-directory: client
        run: |
          node ./scripts/ensure-rollup-native.mjs
          npm run build

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install chromium --with-deps

      - name: Pre-pull pinned PostgreSQL image
        run: docker pull "$VESPER_SDK_TEST_DB_IMAGE"

      - name: Run retained browser invariant suite
        working-directory: client
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24"
          npx playwright test -c e2e/playwright.config.ts
          --project=p1-extended --project=p2-reliability

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: |
            client/e2e/artifacts/
            client/test-results/
          retention-days: 7

  # Gate job — branch protection should require this check.
  e2e-checks:
    if: always()
    needs: [e2e-changes, e2e-test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        run: |
          if [ "${{ needs.e2e-test.result }}" = "failure" ] || [ "${{ needs.e2e-test.result }}" = "cancelled" ]; then
            echo "E2E tests failed or were cancelled"
            exit 1
          fi
          echo "E2E tests passed or were skipped (no relevant changes)"
