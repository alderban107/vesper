upstream vesper_api {
    server app:4000;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;

    location /twemoji/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ordinary JSON/urlencoded API bodies stay at nginx's 1 MiB server limit.
    # Only the authenticated attachment endpoint receives the 51 MiB multipart
    # envelope allowance, with at most two buffered uploads per client address.
    location = /api/v1/attachments {
        client_max_body_size 51m;
        limit_conn upload_clients 2;
        proxy_pass http://vesper_api;
        include /tmp/proxy_headers.inc;
    }

    location /api/ {
        proxy_pass http://vesper_api;
        include /tmp/proxy_headers.inc;
    }

    location /uploads/ {
        proxy_pass http://vesper_api;
        include /tmp/proxy_headers.inc;
    }

    location /socket/ {
        proxy_pass http://vesper_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /tmp/proxy_headers.inc;
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://vesper_api;
        include /tmp/proxy_headers.inc;
    }

    location /metrics {
        proxy_pass http://vesper_api;
        include /tmp/proxy_headers.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
