# Client CI — typecheck and production build
#
# Runs npm run check:web when client/ or sdk/ files change. Uses a
# gate job (client-checks) for branch protection compatibility.
#
# Change detection diffs the branch against its merge-base with
# main, so every push is evaluated against the full set of changes
# the branch introduces — not just the latest commit.

name: Client Tests

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]

concurrency:
  group: test-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.check.outputs.client }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for client changes
        id: check
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")

          if [ -z "$BASE" ]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Any non-markdown files changed under client/, sdk/, or this workflow?
          if git diff --name-only "$BASE" "${{ github.sha }}" -- 'client/' 'sdk/' '.github/workflows/test-client.yml' | grep -qvE '\.md$'; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=false" >> "$GITHUB_OUTPUT"
          fi

  client-test:
    needs: client-changes
    if: needs.client-changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci --workspaces=false

      - name: Ensure Rollup native package
        working-directory: client
        run: node ./scripts/ensure-rollup-native.mjs

      - name: Audit desktop and build dependencies
        working-directory: client
        run: npm audit --workspaces=false

      - name: Unit tests, typecheck, and build
        working-directory: client
        run: npm run test:unit && npm run check:web

  # Gate job — branch protection should require this check.
  client-checks:
    if: always()
    needs: [client-changes, client-test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        run: |
          if [ "${{ needs.client-test.result }}" = "failure" ] || [ "${{ needs.client-test.result }}" = "cancelled" ]; then
            echo "Client checks failed or were cancelled"
            exit 1
          fi
          echo "Client checks passed or were skipped (no client changes)"
