# Client CI — typecheck and production build
#
# Runs npm run check:web when client/ files change. Uses a gate
# job (client-checks) for branch protection compatibility.

name: Client Tests

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]

concurrency:
  group: test-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.check.outputs.client }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for client changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.sha }}
          fi

          # Any non-markdown files changed under client/?
          if git diff --name-only "$BASE" "$HEAD" -- 'client/' | grep -qvE '\.md$'; then
            echo "client=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=false" >> "$GITHUB_OUTPUT"
          fi

  client-test:
    needs: client-changes
    if: needs.client-changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck and build
        working-directory: client
        run: npm run check:web

  # Gate job — branch protection should require this check.
  client-checks:
    if: always()
    needs: [client-changes, client-test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        run: |
          if [ "${{ needs.client-test.result }}" = "failure" ] || [ "${{ needs.client-test.result }}" = "cancelled" ]; then
            echo "Client checks failed or were cancelled"
            exit 1
          fi
          echo "Client checks passed or were skipped (no client changes)"
