# coturn TURN server configuration

listening-port=3478
tls-listening-port=5349

# Relay ports for WebRTC media
min-port=50000
max-port=50100

# Authentication, realm, and advertised external address are supplied by
# docker-compose.yml. Vesper currently emits long-term username/password ICE
# credentials, so REST shared-secret mode must not be enabled here.

# Never relay traffic into host/LAN/link-local/multicast/reserved networks.
# TURN is an Internet media relay, not an authenticated proxy into the
# deployment's private network.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Bound a leaked shared beta credential. These quotas apply to the bundled
# long-term TURN username as a whole, not to individual Vesper accounts.
total-quota=1000
user-quota=1000
max-bps=5000000

# Logging
log-file=stdout
verbose

# Disable CLI
no-cli

# Fingerprint for TURN messages
fingerprint
