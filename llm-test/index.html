<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vesper AI Assistant — Local LLM Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #1a1a2e; color: #e0e0e0; padding: 2rem; max-width: 850px; margin: 0 auto; }
    h1 { margin-bottom: 0.3rem; font-size: 1.4rem; }
    h1 span { font-size: 0.8rem; color: #888; font-weight: normal; }
    #status { padding: 1rem; background: #16213e; border-radius: 8px; margin: 1rem 0; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
    #db-info { padding: 0.6rem 1rem; background: #0a1628; border-radius: 6px; margin-bottom: 1rem; font-size: 0.8rem; color: #667; font-family: monospace; }
    #chat { display: flex; flex-direction: column; gap: 0.5rem; }
    #messages { min-height: 300px; max-height: 500px; overflow-y: auto; padding: 1rem; background: #0f3460; border-radius: 8px; }
    .msg { margin-bottom: 0.75rem; line-height: 1.5; white-space: pre-wrap; }
    .msg.user { color: #7ec8e3; }
    .msg.assistant { color: #c8e6c9; }
    .msg.tool { color: #ffd54f; font-family: monospace; font-size: 0.85rem; }
    .msg.tool-result { color: #aaa; font-family: monospace; font-size: 0.8rem; background: #0a1628; padding: 0.5rem; border-radius: 4px; border-left: 3px solid #ffd54f; }
    .msg .label { font-weight: bold; font-size: 0.75rem; text-transform: uppercase; opacity: 0.6; margin-bottom: 2px; }
    #input-row { display: flex; gap: 0.5rem; }
    #prompt { flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid #333; background: #16213e; color: #e0e0e0; font-size: 1rem; }
    button { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #e94560; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #presets { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .preset { padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #333; background: #16213e; color: #aaa; cursor: pointer; font-size: 0.8rem; }
    .preset:hover { border-color: #e94560; color: #e0e0e0; }
    #stats { font-family: monospace; font-size: 0.8rem; color: #888; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Vesper AI Assistant <span>local LLM + simulated message store</span></h1>
  <div id="status">Initializing...</div>

  <div id="db-info">
    Simulated message DB: 20 messages across #general, #engineering, #design — authors: alice, bob, carol, dave, eve
  </div>

  <div id="presets">
    <div class="preset" data-prompt="What happened in #engineering today?">What happened in #engineering?</div>
    <div class="preset" data-prompt="What are the action items from today?">Action items</div>
    <div class="preset" data-prompt="What did carol say about redis?">Carol + redis</div>
    <div class="preset" data-prompt="Who's doing the demo on monday?">Who's doing the demo?</div>
    <div class="preset" data-prompt="Were there any bugs reported today?">Any bugs?</div>
    <div class="preset" data-prompt="Did anyone share a figma link?">Figma link?</div>
  </div>

  <div id="chat">
    <div id="messages"></div>
    <div id="input-row">
      <input id="prompt" type="text" placeholder="Ask about your messages..." disabled />
      <button id="send" disabled>Send</button>
    </div>
    <div id="stats"></div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
