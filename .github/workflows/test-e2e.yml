# E2E CI — Playwright browser tests
#
# Runs p0-smoke as the enforced gate, then p1-extended and p2-reliability
# as informational suites (failures don't block PRs).
# The test harness boots its own PostgreSQL (Docker), Phoenix server, and Vite
# dev server automatically via globalSetup.

name: E2E Tests

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]

concurrency:
  group: test-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")

          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # E2E tests exercise the full stack; also trigger on workflow changes
          if git diff --name-only "$BASE" "${{ github.sha }}" -- 'server/' 'client/' 'sdk/' 'scripts/' '.github/workflows/test-e2e.yml' | grep -qvE '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-test:
    needs: e2e-changes
    if: needs.e2e-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "55432"
      TEST_DB_USER: vesper_sdk
      TEST_DB_PASS: vesper_sdk

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Elixir deps
        uses: actions/cache@v5
        with:
          path: |
            server/deps
            server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('server/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install Elixir dependencies
        working-directory: server
        run: mix deps.get

      - name: Compile server
        working-directory: server
        run: mix compile

      - name: Install Node dependencies
        run: npm ci

      - name: Ensure Rollup native package
        working-directory: client
        run: node ./scripts/ensure-rollup-native.mjs

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install chromium --with-deps

      - name: Pre-pull Postgres image
        run: docker pull postgres:16-alpine

      - name: Run p0-smoke tests (enforced gate)
        id: p0
        working-directory: client
        run: npm run test:e2e:p0

      - name: Run p1/p2 suites (informational)
        if: always() && steps.p0.outcome != 'failure'
        id: extended
        working-directory: client
        continue-on-error: true
        run: npx playwright test -c e2e/playwright.config.ts --project=p1-extended --project=p2-reliability --no-deps

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts
          path: |
            client/e2e/artifacts/
            client/test-results/
          retention-days: 7

  # Gate job — branch protection should require this check.
  e2e-checks:
    if: always()
    needs: [e2e-changes, e2e-test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        run: |
          if [ "${{ needs.e2e-test.result }}" = "failure" ] || [ "${{ needs.e2e-test.result }}" = "cancelled" ]; then
            echo "E2E tests failed or were cancelled"
            exit 1
          fi
          echo "E2E tests passed or were skipped (no relevant changes)"
