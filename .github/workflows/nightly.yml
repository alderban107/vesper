name: Nightly Distributed Recovery Validation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-validation
  cancel-in-progress: true

# Nightly builds are deliberately CI-only. Public artifacts are produced only by
# release.yml, where native signing, provenance, checksums, and the complete
# platform matrix are mandatory.
permissions:
  contents: read

jobs:
  distributed-client-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIX_ENV: test
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "55432"
      TEST_DB_USER: vesper_sdk
      TEST_DB_PASS: vesper_sdk
      VESPER_SDK_TEST_DB_IMAGE: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
      VESPER_PERF_MULTIPLIER: "5"
      CHAOS_TOTAL_USERS: "24"
      CHAOS_WORKER_COUNT: "4"
      CHAOS_CHANNEL_COUNT: "8"
      CHAOS_ACTIVE_CHANNEL_COUNT: "4"
      CHAOS_DURATION_SECONDS: "120"
      CHAOS_HISTORY_SEED_MESSAGES: "40"
      # Bulk-seeded scale users intentionally have no account-root recovery
      # envelope. Real logout/login recovery remains covered by the SDK gate.
      CHAOS_ENABLE_LOGIN_RESTORE: "false"
      CHAOS_SECONDARY_EVERY: "2"
      CHAOS_SCOPE_COHORT_SIZE: "6"
      CHAOS_MULTI_COHORT_SIZE: "0"
      CHAOS_TARGET_LATENCY_MS: "750"
      CHAOS_ARTIFACT_DIR: sdk/artifacts/nightly

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Elixir dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            server/deps
            server/_build
          key: nightly-mix-${{ runner.os }}-${{ hashFiles('server/mix.lock') }}
          restore-keys: nightly-mix-${{ runner.os }}-

      - name: Install dependencies
        run: |
          npm ci
          cd server
          mix deps.get
          mix compile

      - name: Start pinned PostgreSQL fixture
        run: sdk/scripts/start-test-postgres.sh

      - name: Run four-worker recovery soak
        run: |
          npm --prefix sdk run build
          node sdk/scripts/run-chaos-soak.mjs

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-scale-recovery-${{ github.run_id }}
          path: sdk/artifacts/nightly/
          if-no-files-found: error
          retention-days: 14

      - name: Stop PostgreSQL fixture
        if: always()
        run: sdk/scripts/stop-test-postgres.sh
