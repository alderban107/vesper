appId: com.vesper
productName: Vesper
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - "!node_modules/**/*"
  - node_modules/better-sqlite3-multiple-ciphers/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/prebuild-install/**/*
asar: true
linux:
  icon: build/icon.png
  executableName: vesper
  synopsis: End-to-end encrypted messaging
  target:
    - AppImage
    - deb
  category: Network
  maintainer: vesper
  syncDesktopName: true
appImage:
  # electron-builder otherwise adds --no-sandbox to the desktop entry for
  # legacy AppImage toolsets. Let AppRun fall back only on hosts where user
  # namespaces are genuinely unavailable instead of disabling Chromium's
  # sandbox unconditionally.
  executableArgs: []
mac:
  icon: build/icon.icns
  hardenedRuntime: true
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Vesper uses the microphone for encrypted voice calls.
    NSCameraUsageDescription: Vesper uses the camera when you choose to share video.
  target:
    - dmg
    - zip
  category: public.app-category.social-networking
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
publish:
  provider: github
  owner: alderban107
  repo: vesper
