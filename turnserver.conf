# coturn TURN server configuration

listening-port=3478
tls-listening-port=5349

# Relay ports for WebRTC media
min-port=50000
max-port=50100

# Authentication, realm, and advertised external address are supplied by
# docker-compose.yml. Vesper currently emits long-term username/password ICE
# credentials, so REST shared-secret mode must not be enabled here.

# Logging
log-file=stdout
verbose

# Disable CLI
no-cli

# Fingerprint for TURN messages
fingerprint
